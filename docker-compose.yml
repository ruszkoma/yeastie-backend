# Local development and tests only. Production runs on shared cPanel hosting (see README_deploy.md).
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root-local-only
    volumes:
      - ./docker/mariadb-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 30

  php:
    build:
      context: docker
      dockerfile: php.Dockerfile
    image: yeastie-php:8.5
    working_dir: /app
    volumes:
      - .:/app
    environment:
      CI_ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
